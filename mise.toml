[tools]
# Keep in sync with the `go` directive in go.mod.
go = "1.27.1"
# Runs the npm tools below. Pinned so CI and local runs match.
node = "22.15.1"
# CI installs this pin. 2.14.0 matches the finfocus plugins.
golangci-lint = "2.14.0"
# Release binary building, used by .github/workflows/release.yml.
goreleaser = "2.18.2"
"npm:@fission-ai/openspec" = "1.14.1"
"npm:markdownlint-cli2" = "0.23.3"
"npm:@commitlint/cli" = "21.2.3"
