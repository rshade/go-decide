name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # mise.toml pins the same Go as go.mod, plus golangci-lint, Node,
      # markdownlint-cli2, commitlint and OpenSpec.
      # setup-go then selects the toolchain from go.mod, so a go.mod bump is
      # what CI builds with even if the mise pin lags.
      - name: Install tools from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Set up Go from go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
        env:
          TYPESAFE_API_KEY: ""

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: markdownlint
        run: mise exec -- markdownlint-cli2 "**/*.md"

      - name: OpenSpec
        run: mise exec -- openspec validate --all --strict

      - name: commitlint
        env:
          COMMITLINT_FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          # A force-push leaves github.event.before out of the checkout, so
          # an unknown or empty start falls back to the head commit.
          if [ -z "${COMMITLINT_FROM}" ] \
            || [ "${COMMITLINT_FROM}" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${COMMITLINT_FROM}^{commit}" 2>/dev/null; then
            mise exec -- commitlint --from HEAD~1 --to HEAD --verbose
          else
            mise exec -- commitlint --from "${COMMITLINT_FROM}" --to "${GITHUB_SHA}" --verbose
          fi
