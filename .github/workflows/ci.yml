name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # setup-go owns Go here. A mise-managed Go would export its GOROOT, and
    # setup-go only changes PATH, so a mise pin that differs from go.mod
    # pairs one release's go command with another's compiler and fails
    # every package ("compile: version ... does not match go tool version").
    env:
      MISE_DISABLE_TOOLS: go
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # mise.toml pins golangci-lint, Node, markdownlint-cli2, commitlint and
      # OpenSpec (and Go for local use, skipped here by MISE_DISABLE_TOOLS).
      # setup-go selects the toolchain from go.mod, so a go.mod bump is what
      # CI builds with whatever the mise Go pin says.
      - name: Install tools from mise.toml
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
        env:
          TYPESAFE_API_KEY: ""

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: markdownlint
        run: mise exec -- markdownlint-cli2 "**/*.md"

      - name: OpenSpec
        run: mise exec -- openspec validate --all --strict

      - name: commitlint
        env:
          COMMITLINT_FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          # A force-push leaves github.event.before out of the checkout, so
          # an unknown or empty start falls back to the head commit.
          if [ -z "${COMMITLINT_FROM}" ] \
            || [ "${COMMITLINT_FROM}" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${COMMITLINT_FROM}^{commit}" 2>/dev/null; then
            mise exec -- commitlint --from HEAD~1 --to HEAD --verbose
          else
            mise exec -- commitlint --from "${COMMITLINT_FROM}" --to "${GITHUB_SHA}" --verbose
          fi
